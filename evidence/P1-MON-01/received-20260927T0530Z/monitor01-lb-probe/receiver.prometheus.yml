global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/fds/monitor01/receiver/watchdog.rules.yml
scrape_configs:
  - job_name: blackbox-api-lb
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["10.1.93.109:6443"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
