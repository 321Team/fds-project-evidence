apiVersion: v1
kind: ServiceAccount
metadata: {name: p1-mon-pf-verify, namespace: monitoring-api}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: p1-mon-pf-verify, namespace: monitoring-api}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["grafana-f65457bfd-ckjgj"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    resourceNames: ["grafana-f65457bfd-ckjgj"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: p1-mon-pf-verify, namespace: monitoring-api}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: p1-mon-pf-verify}
subjects: [{kind: ServiceAccount, name: p1-mon-pf-verify, namespace: monitoring-api}]
