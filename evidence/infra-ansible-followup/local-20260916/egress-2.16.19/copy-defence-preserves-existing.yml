- name: copy-defence-preserves-existing
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cr_mon_phase: apply
    cr_mon_state_dir: /workspace/scratch/d7770f5e34f6/egress-final-216/state
    cr_mon_change_id: CR-P1-MON-01-01
    cr_mon_baseline_file:
      stat:
        exists: false
    cr_mon_squid_conf_before:
      stat:
        exists: true
    ansible_python_interpreter: /workspace/scratch/d7770f5e34f6/ansible-ci-linux-1/runtime/venv-2.16.19/bin/python
  tasks:
  - name: Preserve original squid configuration once
    ansible.builtin.copy:
      remote_src: true
      src: /workspace/scratch/d7770f5e34f6/egress-final-216/current.conf
      dest: '{{ cr_mon_state_dir }}/original-squid.conf'
      force: false
      mode: '0600'
    when:
    - cr_mon_phase == 'apply'
    - not ansible_check_mode
    - cr_mon_squid_conf_before.stat.exists
    - not cr_mon_baseline_file.stat.exists
