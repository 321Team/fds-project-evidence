- name: baseline-invalid-proxy_port
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cr_mon_phase: apply
    cr_mon_state_dir: /workspace/scratch/d7770f5e34f6/egress-final-216/state
    cr_mon_change_id: CR-P1-MON-01-01
    cr_mon_baseline_file:
      stat:
        exists: false
    cr_mon_squid_conf_before:
      stat:
        exists: true
    cr_mon_baseline:
      change_id: CR-P1-MON-01-01
      inventory_hostname: localhost
      squid_preinstalled: true
      squid_conf_preexisted: true
      squid_service_active_state: active
      squid_service_enabled_state: enabled
      squid_conf_owner: root
      squid_conf_group: root
      squid_conf_mode: '0644'
      firewalld_default_zone: public
      proxy_port: true
      proxy_allowed_clients:
      - 10.1.93.105
      firewalld_permanent_rules_before: []
      firewalld_runtime_rules_before: []
    ansible_python_interpreter: /workspace/scratch/d7770f5e34f6/ansible-ci-linux-1/runtime/venv-2.16.19/bin/python
  tasks:
  - name: Validate preserved baseline identity and restoration fields
    ansible.builtin.assert:
      that:
      - cr_mon_baseline is mapping
      - cr_mon_baseline.change_id | default('') == cr_mon_change_id
      - cr_mon_baseline.inventory_hostname | default('') == inventory_hostname
      - cr_mon_baseline.squid_preinstalled is boolean
      - cr_mon_baseline.squid_conf_preexisted is boolean
      - cr_mon_baseline.squid_service_active_state is string
      - cr_mon_baseline.squid_service_enabled_state is string
      - cr_mon_baseline.firewalld_default_zone is string
      - cr_mon_baseline.firewalld_default_zone | length > 0
      - cr_mon_baseline.proxy_port is integer
      - cr_mon_baseline.proxy_port >= 1 and cr_mon_baseline.proxy_port <= 65535
      - cr_mon_baseline.proxy_allowed_clients | type_debug == 'list'
      - cr_mon_baseline.proxy_allowed_clients | length > 0
      - cr_mon_baseline.proxy_allowed_clients | select('string') | list | length ==
        cr_mon_baseline.proxy_allowed_clients | length
      - cr_mon_baseline.firewalld_permanent_rules_before | type_debug == 'list'
      - cr_mon_baseline.firewalld_runtime_rules_before | type_debug == 'list'
      - cr_mon_baseline.firewalld_permanent_rules_before | select('string') | list
        | length == cr_mon_baseline.firewalld_permanent_rules_before | length
      - cr_mon_baseline.firewalld_runtime_rules_before | select('string') | list |
        length == cr_mon_baseline.firewalld_runtime_rules_before | length
      fail_msg: Incomplete or invalid preserved baseline. Preserve original-state.json,
        original-squid.conf and evidence, and reconcile their provenance before any
        apply or rollback. Re-running apply does not repair a partial baseline.
  - name: Validate metadata needed to restore an existing configuration
    ansible.builtin.assert:
      that:
      - cr_mon_baseline.squid_conf_owner is string
      - cr_mon_baseline.squid_conf_owner | length > 0
      - cr_mon_baseline.squid_conf_group is string
      - cr_mon_baseline.squid_conf_group | length > 0
      - cr_mon_baseline.squid_conf_mode is string
      - cr_mon_baseline.squid_conf_mode is match('^0[0-7]{3}$')
      fail_msg: Missing or invalid original configuration metadata; preserve state
        and stop.
    when: cr_mon_baseline.squid_conf_preexisted
