- name: SSH guard localhost regression
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
  - name: 'Execute source guard: empty: Count P1 managed SSH keys'
    ansible.builtin.command:
      argv:
      - grep
      - -cE
      - ^(from="10\.250\.10\.10",restrict )?ssh-ed25519[[:space:]]+[^[:space:]]+[[:space:]]+P1-ANS-01
        svc_ansible$
      - /workspace/scratch/d7770f5e34f6/ansible-ci-linux-1/fixtures/guards-results/2.16.19-baseline/fixtures/empty
    register: p1_managed_key_count
    changed_when: false
    check_mode: false
    failed_when: p1_managed_key_count.rc not in [0, 1] or (p1_managed_key_count.stdout
      | int) != 1
    ignore_errors: true
  - name: Persist guard observation
    ansible.builtin.copy:
      dest: /workspace/scratch/d7770f5e34f6/ansible-ci-linux-1/fixtures/guards-results/2.16.19-baseline/result-empty-0.json
      mode: '0600'
      content: '{{ p1_managed_key_count | to_json }}'
  - name: 'Assert contract: empty: 0'
    ansible.builtin.assert:
      that:
      - p1_managed_key_count.failed_when_result is boolean
      - p1_managed_key_count.failed_when_result == True
      - p1_managed_key_count.failed == True
      - p1_managed_key_count.rc == 1
      - (p1_managed_key_count.stdout | trim) == '0'
