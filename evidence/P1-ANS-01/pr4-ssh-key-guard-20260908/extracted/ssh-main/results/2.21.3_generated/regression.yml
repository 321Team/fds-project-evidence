  - name: 'Reset observation: empty: 0'
    ansible.builtin.set_fact:
      guard_rejected: false
      guard_condition_was_true: false
  - name: 'Observe guard: empty: 0'
    block:
    - name: 'Execute source guard: empty: Count P1 managed SSH keys'
      ansible.builtin.command:
        argv:
        - grep
        - -cE
        - ^(from="10\.250\.10\.10",restrict )?ssh-ed25519[[:space:]]+[^[:space:]]+[[:space:]]+P1-ANS-01
          svc_ansible$
        - /home/server01_ansible/FDS_SSH_Main_Verification.dJXZuVxY/results/2.21.3_generated/fixtures/empty
      register: p1_managed_key_count
      changed_when: false
      check_mode: false
      failed_when: p1_managed_key_count.rc not in [0, 1] or (p1_managed_key_count.stdout
        | int) != 1
    rescue:
    - name: Record intended rejection
      ansible.builtin.set_fact:
        guard_rejected: true
        guard_condition_was_true: '{{ ansible_failed_result.failed_when_result | default(false)
