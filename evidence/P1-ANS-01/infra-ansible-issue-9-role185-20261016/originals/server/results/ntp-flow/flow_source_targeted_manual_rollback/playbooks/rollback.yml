- name: CR-P1-NTP-01-01 rollback one failed node
  hosts: k8s_nodes
  gather_facts: false
  become: false
  serial: 1
  any_errors_fatal: true
  pre_tasks:
  - name: Require an explicit rollback target
    ansible.builtin.assert:
      that:
      - cr_ntp_rollback_host is defined
      fail_msg: Provide cr_ntp_rollback_host with exactly one k8s_nodes host.
  - name: Validate the rollback target exists in inventory
    ansible.builtin.assert:
      that:
      - cr_ntp_rollback_host in groups['k8s_nodes']
      fail_msg: '{{ cr_ntp_rollback_host }} is not a member of k8s_nodes.'
  - name: End non-target hosts without changing them
    ansible.builtin.meta: end_host
    when: inventory_hostname != cr_ntp_rollback_host
  - name: Validate rollback approval token
    ansible.builtin.assert:
      that:
      - cr_ntp_rollback_approved | default('') == cr_ntp_change_id
      fail_msg: Set cr_ntp_rollback_approved={{ cr_ntp_change_id }} for the selected
        rollback host.
  - name: Read and validate the immutable CR baseline
    ansible.builtin.include_tasks: ../roles/ntp_source/tasks/_read_original.yml
    when: not (cr_ntp_migrate_main | default(false) | bool)
  tasks:
  - name: Restore the original CR baseline
    ansible.builtin.include_tasks: ../roles/ntp_source/tasks/_restore_dropin.yml
    vars:
      cr_ntp_restore_state: '{{ cr_ntp_original_state }}'
    when: not (cr_ntp_migrate_main | default(false) | bool)
  - name: Restore the immutable main and drop-in baseline
    ansible.builtin.include_tasks: ../roles/ntp_source/tasks/_restore_pair.yml
    vars:
      cr_ntp_pair_restore_action: rollback
    when: cr_ntp_migrate_main | default(false) | bool
  - name: Read post-rollback chronyc sources
    register: cr_ntp_rollback_sources
    changed_when: false
    when: not ansible_check_mode
    ntp_fixture:
      kind: command
      options:
        argv:
        - chronyc
        - -c
        - sources
  - name: Print rollback verdict
    ansible.builtin.debug:
      msg:
        change_id: '{{ cr_ntp_change_id }}'
        host: '{{ inventory_hostname }}'
        dropin_state: RESTORED
        main_state: '{{ (cr_ntp_migrate_main | default(false) | bool) | ternary(''RESTORED'',
          ''UNCHANGED'') }}'
        chronyd: active
        sources: '{{ cr_ntp_rollback_sources.stdout_lines }}'
    when: not ansible_check_mode
  vars:
    bootstrap_host_records:
    - ip: 10.1.93.102
      fqdn: k8s-control01.fds.internal
      hostname: k8s-control01
    - ip: 10.1.93.103
      fqdn: k8s-control02.fds.internal
      hostname: k8s-control02
    - ip: 10.1.93.104
      fqdn: k8s-control03.fds.internal
      hostname: k8s-control03
    - ip: 10.1.93.105
      fqdn: k8s-worker01.fds.internal
      hostname: k8s-worker01
    - ip: 10.1.93.107
      fqdn: k8s-worker02.fds.internal
      hostname: k8s-worker02
    - ip: 10.1.93.108
      fqdn: k8s-worker03.fds.internal
      hostname: k8s-worker03
    cr_dns_change_id: CR-P1-ANS-01-01
    cr_dns_servers:
    - 10.1.93.52
    - 10.1.93.53
    cr_dns_search_domains:
    - fds.internal
    cr_dns_internal_name: k8s-api.fds.internal
    cr_dns_short_name: k8s-api
    cr_dns_expected_address: 10.1.93.109
    cr_dns_external_name: github.com
    cr_dns_state_dir: /var/lib/fds-change/CR-P1-ANS-01-01
    cr_mon_change_id: CR-P1-MON-01-01
    cr_mon_state_dir: /var/lib/fds-change/CR-P1-MON-01-01
    cr_mon_allowed_domains:
    - discord.com
    cr_mon_proxy_allowed_clients:
    - 10.1.93.105
    - 10.1.93.107
    - 10.1.93.108
    cr_ntp_change_id: CR-P1-NTP-01-01
    cr_ntp_source_host: localhost
    cr_ntp_source_ip: 10.1.93.102
    cr_ntp_client_ips:
    - 10.1.93.103
    - 10.1.93.104
    - 10.1.93.105
    - 10.1.93.107
    - 10.1.93.108
    cr_ntp_dropin_path: /results/ntp-flow/flow_source_targeted_manual_rollback/chrony.d/50-cr-p1-ntp-01-01.conf
    cr_ntp_state_dir: /results/ntp-flow/flow_source_targeted_manual_rollback/state
    cr_ntp_migrate_main: true
    cr_ntp_source_upstreams: []
    cr_ntp_offset_max_ms: 100
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%d/.ssh/known_hosts
      -o IdentitiesOnly=yes
    cr_ntp_main_config_path: /results/ntp-flow/flow_source_targeted_manual_rollback/chrony.conf
    cr_ntp_chronyd_path: /supply/chronyd-parser
    cr_ntp_phase: apply
    cr_ntp_change_approved: CR-P1-NTP-01-01
    fixture_root: /results/ntp-flow/flow_source_targeted_manual_rollback
    fixture_scenario:
      source: true
      rollback: true
    ansible_python_interpreter: /scratch/engines/2.21.3/bin/python3
    ansible_facts:
      date_time:
        iso8601: '2026-09-18T00:00:00Z'
    cr_ntp_rollback_host: localhost
    cr_ntp_rollback_approved: CR-P1-NTP-01-01
