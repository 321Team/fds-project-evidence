- name: invalidate-before-interruption
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cr_mon_phase: apply
    cr_mon_state_dir: /results/mon-2.21.3/state
    cr_mon_change_id: CR-P1-MON-01-01
    cr_mon_baseline_file:
      stat:
        exists: false
    cr_mon_squid_conf_before:
      stat:
        exists: true
    ansible_python_interpreter: /scratch/engines/2.21.3/bin/python
  tasks:
  - name: Invalidate managed configuration marker before rollback changes
    ansible.builtin.file:
      path: '{{ cr_mon_state_dir }}/active-config.sha1'
      state: absent
    when: not ansible_check_mode
